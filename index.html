<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submarino DOMI</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Camada A do áudio: gerado por scripts/embutir_audios.py, define
      window.__AUDIOS com os mp3 em data URL. Script clássico de propósito —
      é o que carrega via file://. Se o arquivo não existir, o Chrome só
      registra um 404 e o app cai na camada B sozinho.
    -->
    <script>
      // Injetado por JS em vez de uma tag estática: o Vite tenta resolver
      // <script src> do index.html em tempo de build e removeria a tag, já que
      // o audios.js só existe depois que o script Python roda.
      ;(function () {
        var tag = document.createElement('script')
        tag.src = './audios.js'
        tag.async = false
        window.__AUDIOS_PRONTO = new Promise(function (resolve) {
          tag.onload = function () { resolve() }
          tag.onerror = function () { resolve() }
        })
        document.head.appendChild(tag)
      })()
    </script>
    <!--
      Biblioteca do controle remoto (Fase 6). Mesma tática do audios.js: script
      clássico injetado por JS, versão PINADA, e falha em silêncio. O primeiro
      candidato é o arquivo LOCAL (public/vendor/supabase.js, commitado): por
      file:// e no Pages ele viaja junto com o app e carregar a biblioteca
      custa zero rede — que é o único jeito de confiar nela no dia da feira. A
      jsDelivr fica só de reserva, pra quando alguém copiar o index.html sem a
      pasta vendor/ do lado. A versão da URL de reserva tem que bater com a de
      src/remoto/config.ts, a do public/controle.html e a do arquivo em
      public/vendor/ (o sha e a procedência estão no README de lá). Sem
      nenhum dos dois, `window.supabase` simplesmente não existe e o app roda
      idêntico ao que era antes — o controle pelo celular é um extra, nunca um
      requisito.
    -->
    <script>
      ;(function () {
        var candidatos = [
          './vendor/supabase.js',
          'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js',
        ]
        function tentar(i) {
          if (i >= candidatos.length) {
            console.warn('[remoto] supabase-js não carregou — o controle pelo celular fica off')
            return
          }
          var tag = document.createElement('script')
          tag.src = candidatos[i]
          tag.async = false
          tag.onerror = function () {
            tag.remove()
            tentar(i + 1)
          }
          document.head.appendChild(tag)
        }
        tentar(0)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

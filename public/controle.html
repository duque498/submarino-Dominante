<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem zoom: o operador vai apertar no escuro, com pressa. Um pinch sem
         querer no meio do combate tiraria os botões do lugar. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04141a" />
    <title>DOMI · controle</title>
    <style>
      /* Mesma paleta do HUD do Chromebook: quem olha os dois não vê dois
         aplicativos, vê o mesmo instrumento em duas telas. */
      :root {
        --fundo: #04141a;
        --moldura: rgba(27, 106, 120, 0.8);
        --ciano: #38e8ff;
        --verde: #4dffa6;
        --ambar: #ffc24d;
        --vermelho: #ff6e5a;
        --texto: #bdfff0;
        --fraco: rgba(120, 190, 205, 0.7);
        /* A cor de acento muda por modo (ver [data-modo] mais abaixo): é o que
           diz de relance se a tela pede calma, atenção ou pressa. */
        --acento: var(--ciano);
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        background: var(--fundo);
        color: var(--texto);
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        touch-action: manipulation;
        overscroll-behavior: none;
      }
      body {
        /* dvh e não vh: a barra do navegador do celular come 60–90 px de vh, e
           o botão avançar é justamente o que ficaria embaixo dela. */
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .tela {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }
      .tela--ativa {
        display: flex;
      }
      .oculto {
        display: none !important;
      }

      /* ============ tela 1: seletor ============ */
      .seletor {
        justify-content: center;
        gap: 1.5rem;
        padding: 1.5rem;
      }
      .marca {
        text-align: center;
        letter-spacing: 0.3em;
        color: var(--fraco);
        font-size: 0.85rem;
        text-transform: uppercase;
      }
      .turmas {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
      }
      .turma {
        padding: 1.4rem 0;
        font: 700 1.6rem/1 inherit;
        font-family: inherit;
        letter-spacing: 0.1em;
        color: var(--ciano);
        background: rgba(56, 232, 255, 0.07);
        border: 1px solid var(--moldura);
        border-radius: 4px;
      }
      .turma[aria-pressed='true'] {
        background: rgba(56, 232, 255, 0.22);
        border-color: var(--ciano);
        color: #eafdff;
      }
      #codigo {
        width: 100%;
        padding: 1.1rem;
        font-family: inherit;
        font-size: 2rem;
        letter-spacing: 0.5em;
        text-align: center;
        color: #eafdff;
        background: rgba(4, 20, 26, 0.9);
        border: 1px solid var(--moldura);
        border-radius: 4px;
      }
      .primario {
        width: 100%;
        padding: 1.2rem;
        font-family: inherit;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #04141a;
        background: var(--verde);
        border: 0;
        border-radius: 4px;
      }
      .primario:disabled {
        opacity: 0.4;
      }
      .recado {
        min-height: 3rem;
        font-size: 0.9rem;
        line-height: 1.4;
        text-align: center;
        color: var(--ambar);
      }

      /* ============ tela 2, zona 1: topo ============
         Uma linha, sem borda, sem caixa. Ele informa; não disputa. */
      .topo {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.45rem 0.85rem;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .badge {
        flex: 1;
        min-width: 0;
        color: var(--verde);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .badge--mudo {
        color: var(--ambar);
      }
      /* Ambar porque e uma ressalva, nao um erro: funciona, so que mais
         devagar. `flex: 0 0 auto` pra ele nunca ser o que encolhe. */
      .transporte {
        flex: 0 0 auto;
        padding: 0.1rem 0.3rem;
        color: var(--ambar);
        border: 1px solid var(--ambar);
        border-radius: 2px;
        font-size: 0.62rem;
      }
      .topo button {
        padding: 0.35rem 0.5rem;
        font-family: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        color: var(--fraco);
        background: none;
        border: 0;
      }
      #mais {
        font-size: 1rem;
        letter-spacing: 0.15em;
        line-height: 0.6;
      }

      /* ============ tela 2: tarja de sem-resposta ============
         Fina, entre o topo e a cena. Nunca empurra o rodapé. */
      .tarja {
        display: none;
        padding: 0.35rem 0.85rem;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        text-align: center;
        font-weight: 700;
        color: #2a1a04;
        background: var(--ambar);
      }
      .tarja--visivel {
        display: block;
      }
      .tarja--morta {
        color: #2a0b06;
        background: var(--vermelho);
      }

      /* ============ tela 2, zona 2: cena e instrução ============ */
      .cena {
        padding: 0.7rem 0.85rem 0.9rem;
      }
      .cena__titulo {
        margin: 0;
        font-size: 0.72rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fraco);
        /* Uma linha só: um título comprido que quebrasse em duas empurraria a
           área do modo pra baixo e os botões mudariam de lugar entre cenas. */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .cena__instrucao {
        margin: 0.35rem 0 0;
        font-size: 1.7rem;
        line-height: 1.2;
        color: #eafdff;
        /* No máximo duas linhas: a terceira empurraria a área do modo e o
           operador perderia o contexto de onde os botões ficam. */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: break-word;
      }
      .cena__proxima {
        margin: 0.45rem 0 0;
        font-size: 0.72rem;
        letter-spacing: 0.06em;
        color: rgba(120, 190, 205, 0.45);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ============ tela 2, zona 3: área do modo ============
         Come o espaço que sobrar e rola POR DENTRO. O rodapé nunca se mexe. */
      .modo {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0 0.7rem 0.6rem;
      }
      .modo__cabecalho {
        margin: 0 0 0.55rem;
        padding-top: 0.2rem;
        font-size: 0.7rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--acento);
      }
      /* Emergência pisca devagar: é a única cena em que a demora do operador
         tem custo na tela do projetor. Devagar pra avisar, não pra apavorar. */
      [data-modo='emergencia'] .modo__cabecalho {
        animation: pulsa-acento 1.8s ease-in-out infinite;
      }
      @keyframes pulsa-acento {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      /* A nota da espera fica âmbar quando o áudio do Chromebook está travado:
         é o único passo da apresentação que NÃO dá pra fazer pelo celular. */
      .espera-nota {
        margin: 0;
        padding: 0.8rem 0.7rem;
        font-size: 0.95rem;
        line-height: 1.4;
        color: rgba(120, 190, 205, 0.7);
        border: 1px solid transparent;
        border-radius: 4px;
      }
      .espera-nota--aviso {
        color: var(--ambar);
        border-color: rgba(255, 194, 77, 0.5);
        background: rgba(255, 194, 77, 0.08);
      }
      .modo__vazio {
        display: flex;
        height: 100%;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 0.95rem;
        letter-spacing: 0.06em;
        color: rgba(120, 190, 205, 0.5);
      }
      [data-modo='espera'] { --acento: var(--verde); }
      [data-modo='ativacao'] .modo__vazio { color: var(--ambar); }
      [data-modo='quiz'],
      [data-modo='identificacao'],
      [data-modo='hidrofone'] { --acento: var(--ambar); }
      [data-modo='combate'],
      [data-modo='emergencia'] { --acento: var(--vermelho); }

      /* ============ teclas ============
         Um padrão só: a tecla grande em cima, a função pequena embaixo. */
      .linha {
        display: grid;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .linha--2 { grid-template-columns: repeat(2, 1fr); }
      .linha--3 { grid-template-columns: repeat(3, 1fr); }
      .linha--4 { grid-template-columns: repeat(4, 1fr); }
      .tecla {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.15rem;
        min-height: 62px;
        padding: 0.5rem 0.2rem;
        font-family: inherit;
        color: var(--acento);
        background: rgba(56, 232, 255, 0.06);
        border: 1px solid var(--moldura);
        border-radius: 4px;
        transition: border-color 0.12s linear;
      }
      .tecla b {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1;
      }
      .tecla i {
        font-style: normal;
        font-size: 0.66rem;
        letter-spacing: 0.06em;
        text-transform: lowercase;
        color: var(--fraco);
        text-align: center;
      }
      /* Desabilitada some de cor, não de lugar: layout que pula faz o dedo
         errar o alvo no escuro. */
      .tecla:disabled {
        opacity: 0.35;
        border-color: transparent;
        background: rgba(56, 232, 255, 0.03);
      }
      .tecla--flash {
        border-color: var(--acento);
        box-shadow: inset 0 0 0 1px var(--acento);
      }

      /* ============ combate ============ */
      .setores { grid-template-columns: repeat(3, 1fr); }
      .setores .tecla {
        min-height: 84px;
      }
      .tecla--contato {
        animation: pulsa-borda 1.1s ease-in-out infinite;
      }
      @keyframes pulsa-borda {
        0%, 100% { border-color: var(--vermelho); }
        50% { border-color: rgba(255, 110, 90, 0.25); }
      }
      /* Faixa compacta: rótulo à esquerda, barra à direita, uma linha cada. */
      .faixa {
        display: grid;
        grid-template-columns: 5.2rem 1fr;
        align-items: center;
        gap: 0.4rem 0.6rem;
        margin-top: 0.2rem;
      }
      .faixa span {
        font-size: 0.66rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--fraco);
      }
      .barra {
        height: 8px;
        border: 1px solid var(--moldura);
        border-radius: 2px;
        overflow: hidden;
      }
      .barra > i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--verde);
        transition: width 0.15s linear;
      }
      /* A recarga é recalculada a cada quadro; uma transição por cima disso só
         atrasaria o que já está correto. */
      #barra-recarga { transition: none; }
      .barra--casco > i { background: var(--ambar); }
      .barra--contato > i { background: var(--vermelho); }

      /* ============ emergência ============ */
      .luzes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        margin-top: 0.6rem;
        text-align: center;
      }
      .luz {
        padding: 0.55rem 0.2rem;
        border: 1px solid var(--moldura);
        border-radius: 4px;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        color: rgba(120, 150, 160, 0.45);
      }
      .luz--online {
        color: var(--verde);
        border-color: rgba(77, 255, 166, 0.6);
        background: rgba(77, 255, 166, 0.08);
      }

      /* ============ console ============ */
      #console {
        display: flex;
        margin-top: 0.2rem;
      }
      #texto-comando {
        flex: 1;
        min-width: 0;
        padding: 0.9rem;
        font-family: inherit;
        font-size: 1rem;
        color: #eafdff;
        background: rgba(4, 20, 26, 0.9);
        border: 1px solid var(--moldura);
        border-radius: 4px;
      }

      /* ============ tela 2, zona 4: rodapé ============
         Posição fixa em todos os modos. O avançar é o maior elemento da
         página, e a zona do polegar é dele. */
      .rodape {
        flex: 0 0 auto;
        padding: 0.5rem 0.7rem 0.7rem;
        border-top: 1px solid rgba(27, 106, 120, 0.4);
        background: var(--fundo);
      }
      .secundarias {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.45rem;
        margin-bottom: 0.5rem;
      }
      /* Rótulo empilhado como no resto, e não lado a lado: com três colunas a
         375 px de tela, "espaço pular fala" numa linha só não cabe. */
      .secundarias .tecla {
        min-height: 48px;
        gap: 0.1rem;
        padding: 0.35rem 0.15rem;
        background: none;
        border-color: rgba(27, 106, 120, 0.45);
        color: var(--fraco);
      }
      .secundarias .tecla b { font-size: 0.9rem; }
      .secundarias .tecla i { font-size: 0.6rem; }
      .avancar {
        display: block;
        width: 100%;
        min-height: 96px;
        font-family: inherit;
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #04141a;
        background: var(--verde);
        border: 0;
        border-radius: 5px;
      }
      .avancar:disabled {
        opacity: 0.35;
      }
      .avancar.tecla--flash {
        box-shadow: inset 0 0 0 3px #04141a;
      }

      /* ============ gaveta das perigosas ============
         Fora da tela principal: enquanto estão à vista, competem com o
         avançar — e são as duas que estragariam a apresentação. */
      .gaveta {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        justify-content: flex-end;
        background: rgba(2, 10, 14, 0.75);
      }
      .gaveta--aberta { display: flex; }
      .gaveta__caixa {
        padding: 1rem 0.8rem calc(1rem + env(safe-area-inset-bottom));
        background: #061c24;
        border-top: 1px solid var(--moldura);
      }
      .gaveta__titulo {
        margin: 0 0 0.7rem;
        font-size: 0.7rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--fraco);
      }
      .perigosas {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.6rem;
      }
      .longa {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
        min-height: 84px;
        padding: 0.6rem 0.3rem;
        font-family: inherit;
        color: var(--vermelho);
        background: transparent;
        border: 1px solid rgba(255, 110, 90, 0.5);
        border-radius: 4px;
        overflow: hidden;
      }
      .longa b { font-size: 1.25rem; font-weight: 700; }
      .longa i {
        font-style: normal;
        font-size: 0.66rem;
        letter-spacing: 0.06em;
        color: rgba(255, 110, 90, 0.7);
      }
      .longa > u {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0;
        background: rgba(255, 110, 90, 0.28);
        pointer-events: none;
      }
      .longa:disabled { opacity: 0.35; border-color: transparent; }
      .gaveta__fechar {
        width: 100%;
        margin-top: 0.7rem;
        padding: 0.7rem;
        font-family: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--fraco);
        background: none;
        border: 1px solid rgba(27, 106, 120, 0.45);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <!-- ===================== TELA 1 — SELETOR ===================== -->
    <section class="tela tela--ativa seletor" id="tela-seletor">
      <p class="marca">submarino domi · controle</p>
      <div class="turmas" id="turmas"></div>
      <input
        id="codigo"
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        placeholder="0000"
        autocomplete="off"
      />
      <button class="primario" id="conectar" disabled>conectar</button>
      <p class="recado" id="recado"></p>
    </section>

    <!-- ===================== TELA 2 — CONTROLE ==================== -->
    <section class="tela" id="tela-controle" data-modo="apresentacao">
      <!-- zona 1 -->
      <div class="topo">
        <span class="badge" id="badge">conectando...</span>
        <!-- Fora do #badge de proposito: o badge tem ellipsis e corta pela
             direita, que e exatamente onde o marcador ficaria. Quem some
             tem que ser o nome da turma, nao o aviso de que a tecla vai
             demorar mais. -->
        <span class="transporte" id="transporte" hidden>rest</span>
        <button id="mais" aria-label="mais opções">···</button>
        <button id="trocar">trocar turma</button>
      </div>

      <p class="tarja" id="tarja"></p>

      <!-- zona 2 -->
      <div class="cena">
        <p class="cena__titulo" id="cena-titulo">—</p>
        <p class="cena__instrucao" id="instrucao">aguardando o submarino...</p>
        <p class="cena__proxima" id="cena-proxima"></p>
      </div>

      <!-- zona 3 -->
      <div class="modo" id="modo">
        <p class="modo__cabecalho" id="modo-cabecalho">apresentação</p>

        <div class="modo__vazio oculto" id="bloco-vazio">nada a fazer — aguarde</div>

        <div id="bloco-espera" class="oculto">
          <p class="espera-nota" id="espera-nota">
            o → grande aí embaixo é o que inicia a IA
          </p>
        </div>

        <div id="bloco-apresentacao" class="oculto">
          <div class="linha linha--4">
            <button class="tecla" data-tecla="m"><b>M</b><i>forma →</i></button>
            <button class="tecla" data-tecla="n"><b>N</b><i>forma ←</i></button>
            <button class="tecla" data-tecla="o"><b>O</b><i>esfera</i></button>
            <button class="tecla" data-tecla="t"><b>T</b><i>cronômetro</i></button>
          </div>
          <div class="linha">
            <button class="tecla" data-tecla="/" id="abrir-console">
              <b>/</b><i>console</i>
            </button>
          </div>
          <!-- form e não botão: o "enviar" vira o Enter do teclado do celular,
               que é onde o polegar já está depois de digitar. -->
          <form id="console" class="oculto" autocomplete="off">
            <input
              id="texto-comando"
              placeholder="sonar, status, mapa..."
              enterkeyhint="send"
            />
          </form>
        </div>

        <div id="bloco-numeros" class="oculto">
          <div class="linha linha--4">
            <button class="tecla" data-tecla="1"><b>1</b><i>opção 1</i></button>
            <button class="tecla" data-tecla="2"><b>2</b><i>opção 2</i></button>
            <button class="tecla" data-tecla="3"><b>3</b><i>opção 3</i></button>
            <button class="tecla" data-tecla="4"><b>4</b><i>opção 4</i></button>
          </div>
          <div class="linha linha--2">
            <button class="tecla" data-tecla="Enter"><b>ENTER</b><i>acerto</i></button>
            <button class="tecla" data-tecla="x"><b>X</b><i>revelar</i></button>
          </div>
          <div class="linha linha--2 oculto" id="bloco-vf">
            <button class="tecla" data-tecla="v"><b>V</b><i>verdadeiro</i></button>
            <button class="tecla" data-tecla="f"><b>F</b><i>falso</i></button>
          </div>
        </div>

        <div id="bloco-combate" class="oculto">
          <div class="linha setores">
            <button class="tecla" data-tecla="1" id="setor-1"><b>1</b><i>proa</i></button>
            <button class="tecla" data-tecla="2" id="setor-2"><b>2</b><i>bombordo</i></button>
            <button class="tecla" data-tecla="3" id="setor-3"><b>3</b><i>estibordo</i></button>
          </div>
          <div class="faixa">
            <span>recarga</span><div class="barra"><i id="barra-recarga"></i></div>
            <span>casco</span><div class="barra barra--casco"><i id="barra-casco"></i></div>
            <span>contato</span><div class="barra barra--contato"><i id="barra-contato"></i></div>
          </div>
        </div>

        <div id="bloco-emergencia" class="oculto">
          <div class="linha linha--2">
            <button class="tecla" data-tecla="1"><b>1</b><i>casco</i></button>
            <button class="tecla" data-tecla="2"><b>2</b><i>sonar</i></button>
          </div>
          <div class="luzes">
            <span class="luz" id="luz-casco">casco</span>
            <span class="luz" id="luz-sonar">sonar</span>
            <span class="luz" id="luz-com">comunicação</span>
          </div>
        </div>
      </div>

      <!-- zona 4 -->
      <div class="rodape">
        <div class="secundarias">
          <button class="tecla" data-tecla="ArrowLeft"><b>←</b><i>voltar</i></button>
          <button class="tecla" data-tecla=" "><b>espaço</b><i>pular fala</i></button>
          <button class="tecla" data-tecla="Escape"><b>esc</b><i>fechar painel</i></button>
        </div>
        <button class="avancar" data-tecla="ArrowRight">→ avançar</button>
      </div>
    </section>

    <!-- gaveta das perigosas -->
    <div class="gaveta" id="gaveta">
      <div class="gaveta__caixa">
        <p class="gaveta__titulo">segure 2 segundos</p>
        <div class="perigosas">
          <button class="longa" data-tecla="p"><u></u><b>P</b><i>pane</i></button>
          <button class="longa" data-tecla="r"><u></u><b>R</b><i>reiniciar</i></button>
        </div>
        <button class="gaveta__fechar" id="fechar-gaveta">fechar</button>
      </div>
    </div>

    <!-- Mesma versão PINADA do src/remoto/config.ts e do index.html: mudou uma,
         mude as três. A 2.45.4 mandava a chave como `access_token` no
         `phx_join`, e o Realtime valida esse campo como JWT — uma chave
         `sb_publishable_` não é JWT, então o join era recusado. Esta autentica
         só pelo `?apikey=`. O porquê completo está no config.ts. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
    <script>
      'use strict'
      // As mesmas credenciais do src/remoto/config.ts. A chave é publishable:
      // pública por desenho. Quem protege a sessão é o código de 4 dígitos.
      var SUPABASE_URL = 'https://wihrdhckrqgoofkfofug.supabase.co'
      var SUPABASE_KEY = 'sb_publishable_OuSu06JQOJv-yuNlzJk0Ww_o_JeIGlp'
      var TURMAS = ['2A', '2B', '3A']
      var MS_PONG = 3000
      var MS_MUDO = 6000
      var MS_MORTO = 12000
      var MS_DEBOUNCE = 300
      var MS_LONGO = 2000
      var MS_FLASH = 120
      // Mesmo valor do MS_COOLDOWN de src/cenas/Combate.tsx. Precisa estar
      // aqui porque o `estado` chega a cada 2 s e a recarga dura 1,2 s.
      var MS_COOLDOWN = 1200

      // --- Fase 6.3: o segundo transporte, por REST puro --------------
      // Na rede da escola o wss:// é derrubado mas o HTTPS passa. Quando
      // o Realtime não sobe, os dois lados passam a conversar por uma
      // tabela (docs/sinais.sql): um INSERE, o outro lê por polling.
      // Sem lib nova: PostgREST é HTTP com header, e fetch já vem no
      // navegador. O supabase-js só serve pro Realtime.
      var REST_SINAIS = SUPABASE_URL + '/rest/v1/sinais'
      // Quanto o Realtime tem pra subir antes de desistirmos. Mesmo
      // valor do MS_ESPERA_REALTIME do src/remoto/config.ts.
      var MS_ESPERA_REALTIME = 4000
      // O celular lê mais devagar que o Chromebook (600 contra 400 ms):
      // ele só espera `estado`, que sai de 2 em 2 s, enquanto o
      // Chromebook espera tecla, que precisa parecer instantânea.
      var MS_POLL_REST = 600

      var NOME_DO_MODO = {
        ativacao: 'ativação',
        espera: 'em espera',
        apresentacao: 'apresentação',
        quiz: 'quiz',
        identificacao: 'identificação',
        hidrofone: 'hidrofone',
        combate: 'combate',
        emergencia: 'reparo',
        mergulho: 'mergulho',
      }

      var $ = function (id) { return document.getElementById(id) }
      var cliente = null
      var canal = null
      var turmaEscolhida = null
      var codigoEscolhido = null
      var ultimoEstado = null
      var ultimoRecebido = 0
      var aguardandoPong = null
      var relogioMudo = 0
      // 'realtime', 'rest' ou null enquanto ninguém venceu ainda.
      var transporte = null
      var canalIda = null
      var canalVolta = null
      var marcador = 0
      var timerEspera = 0
      var timerPoll = 0
      var lendo = false
      var msRest = 0

      // ---------- tela 1 ----------
      TURMAS.forEach(function (t) {
        var b = document.createElement('button')
        b.className = 'turma'
        b.textContent = t
        b.setAttribute('aria-pressed', 'false')
        b.onclick = function () {
          turmaEscolhida = t
          Array.prototype.forEach.call($('turmas').children, function (o) {
            o.setAttribute('aria-pressed', String(o === b))
          })
          revalidar()
        }
        $('turmas').appendChild(b)
      })

      function revalidar() {
        $('conectar').disabled = !(turmaEscolhida && /^\d{4}$/.test($('codigo').value))
      }
      $('codigo').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 4)
        revalidar()
      })

      // Última escolha: no dia da feira o celular vai recarregar, e digitar o
      // código de novo no escuro é exatamente o que não pode acontecer.
      try {
        var salvo = JSON.parse(localStorage.getItem('domi-remoto') || '{}')
        if (salvo.turma && TURMAS.indexOf(salvo.turma) >= 0) {
          turmaEscolhida = salvo.turma
          Array.prototype.forEach.call($('turmas').children, function (o) {
            o.setAttribute('aria-pressed', String(o.textContent === salvo.turma))
          })
        }
        if (salvo.codigo) $('codigo').value = salvo.codigo
        revalidar()
      } catch (e) {}

      $('conectar').onclick = function () { conectar(turmaEscolhida, $('codigo').value) }
      $('trocar').onclick = function () {
        sair()
        mostrar('tela-seletor')
      }
      $('mais').onclick = function () { $('gaveta').classList.add('gaveta--aberta') }
      $('fechar-gaveta').onclick = fecharGaveta
      function fecharGaveta() { $('gaveta').classList.remove('gaveta--aberta') }

      function mostrar(id) {
        ;['tela-seletor', 'tela-controle'].forEach(function (t) {
          $(t).classList.toggle('tela--ativa', t === id)
        })
        if (id === 'tela-seletor') fecharGaveta()
      }

      // ================================================================
      // Transporte B: REST puro
      //
      // Cinco funções sem estado próprio. Nenhuma delas rejeita: toda
      // falha vira null/lista vazia. Um transporte de emergência que
      // explode no meio da apresentação não é um transporte de
      // emergência.
      // ================================================================

      // A chave vai em DOIS headers de propósito: `apikey` é o que o
      // PostgREST usa pra achar o projeto, `Authorization` é o que
      // define o papel (anon) na hora de avaliar a RLS. Só um dos dois
      // dá 401 com uma mensagem que não ajuda.
      function cabecalhos(extra) {
        var h = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
        for (var k in extra || {}) h[k] = extra[k]
        return h
      }

      // O maior id que o canal de volta já tem. Chamado UMA vez, ao
      // entrar no REST: sem ele o celular leria a tabela do zero e
      // aplicaria o `estado` de uma sessão anterior antes do atual
      // chegar — a tela piscaria numa cena errada.
      function restUltimoId(nome, pronto) {
        fetch(REST_SINAIS + '?canal=eq.' + encodeURIComponent(nome) +
              '&select=id&order=id.desc&limit=1', { headers: cabecalhos() })
          .then(function (r) { return r.ok ? r.json() : [] })
          .then(function (linhas) { pronto((linhas[0] && linhas[0].id) || 0) })
          .catch(function () { pronto(0) })
      }

      function restEnviar(nome, evento, payload) {
        return fetch(REST_SINAIS, {
          method: 'POST',
          headers: cabecalhos({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }),
          body: JSON.stringify({ canal: nome, evento: evento, payload: payload }),
        }).catch(function () { return null })
      }

      // Uma passada de leitura do canal de volta.
      function restPuxar(pronto) {
        if (lendo) { pronto(0); return }
        lendo = true
        var comeco = Date.now()
        fetch(REST_SINAIS + '?canal=eq.' + encodeURIComponent(canalVolta) +
              '&id=gt.' + marcador + '&select=id,evento,payload&order=id.asc',
              { headers: cabecalhos() })
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (linhas) {
            lendo = false
            msRest = Date.now() - comeco
            if (!linhas || !linhas.length) { pronto(0); return }
            for (var i = 0; i < linhas.length; i++) {
              var l = linhas[i]
              if (l.id > marcador) marcador = l.id
              aoEvento(l.evento, l.payload || {})
            }
            pronto(linhas.length)
          })
          .catch(function () { lendo = false; pronto(0) })
      }

      function cicloRest() {
        if (transporte !== 'rest') return
        restPuxar(function () {
          if (transporte !== 'rest') return
          timerPoll = setTimeout(cicloRest, MS_POLL_REST)
        })
      }

      // ================================================================
      // O ponto único por onde todo evento entra, venha de onde vier.
      // Realtime e REST entregam exatamente os mesmos eventos.
      // ================================================================
      var meuPing = ''
      function aoEvento(evento, p) {
        if (evento === 'pong') {
          if (p.id !== meuPing) return
          if (aguardandoPong) { clearTimeout(aguardandoPong); aguardandoPong = null }
          try {
            localStorage.setItem('domi-remoto',
              JSON.stringify({ turma: turmaEscolhida, codigo: codigoEscolhido }))
          } catch (e) {}
          ultimoRecebido = Date.now()
          abrirControle(turmaEscolhida)
        } else if (evento === 'estado') {
          ultimoRecebido = Date.now()
          aplicarEstado(p)
        }
      }

      // Manda um evento pelo transporte que estiver valendo. Todo envio
      // do app passa por aqui — e é por isso que nenhum botão precisa
      // saber que existem dois caminhos.
      function enviarEvento(evento, payload) {
        if (transporte === 'rest') {
          restEnviar(canalIda, evento, payload)
          return
        }
        try {
          canal && canal.send({ type: 'broadcast', event: evento, payload: payload })
        } catch (e) {}
      }

      function sair() {
        if (aguardandoPong) { clearTimeout(aguardandoPong); aguardandoPong = null }
        if (relogioMudo) { clearInterval(relogioMudo); relogioMudo = 0 }
        if (timerEspera) { clearTimeout(timerEspera); timerEspera = 0 }
        if (timerPoll) { clearTimeout(timerPoll); timerPoll = 0 }
        try { if (cliente && canal) cliente.removeChannel(canal) } catch (e) {}
        canal = null
        transporte = null
        marcador = 0
        lendo = false
        ultimoEstado = null
      }

      // Desiste do Realtime e vai pro REST. Só acontece uma vez por
      // tentativa de conexão.
      // `recado` existe porque o mesmo caminho serve a duas histórias bem
      // diferentes: o WS que falhou (aí é a rede da escola, e dizer isso
      // ajuda) e o pong que não veio (aí pode ser só código errado, e
      // culpar o wi-fi mandaria o operador procurar o problema no lugar
      // errado).
      function irParaRest(recado) {
        if (transporte === 'rest') return
        if (timerEspera) { clearTimeout(timerEspera); timerEspera = 0 }
        // Dois transportes vivos ao mesmo tempo seria tecla duplicada.
        try { if (cliente && canal) cliente.removeChannel(canal) } catch (e) {}
        canal = null
        transporte = 'rest'
        $('recado').textContent = recado || 'wi-fi bloqueando tempo real — tentando pelo caminho lento...'
        restUltimoId(canalVolta, function (id) {
          if (transporte !== 'rest') return
          marcador = id
          restEnviar(canalIda, 'ping', { id: meuPing })
          if (aguardandoPong) clearTimeout(aguardandoPong)
          aguardandoPong = setTimeout(semResposta, MS_PONG)
          cicloRest()
        })
      }

      function semResposta() {
        aguardandoPong = null
        $('conectar').disabled = false
        revalidar()
        $('recado').textContent =
          'Nenhum submarino respondeu em ' + turmaEscolhida + ' com o código ' +
          codigoEscolhido + ' — confira o código na tela do Chromebook'
        sair()
      }

      function conectar(turma, codigo) {
        sair()
        turmaEscolhida = turma
        codigoEscolhido = codigo
        canalIda = 'domi:' + turma + ':' + codigo
        canalVolta = canalIda + ':resp'
        meuPing = String(Date.now())
        $('recado').textContent = 'procurando o submarino...'
        $('conectar').disabled = true

        // Sem a biblioteca não há Realtime — mas o REST não precisa
        // dela. Então isto deixou de ser o fim da linha.
        if (!window.supabase) {
          irParaRest()
          return
        }

        try {
          cliente = cliente || window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            // Mesmos params do src/remoto/receptor.ts. `log_level` e lido
            // pelo servidor: faz o Realtime registrar conexao e join nos
            // logs do projeto.
            realtime: { params: { eventsPerSecond: 20, log_level: 'info' } },
          })
          canal = cliente.channel(canalIda, { config: { broadcast: { self: false } } })

          // O relógio dos 4 s. Cobre o caso que mais dói e que nenhum
          // callback reporta: o WebSocket que abre, não recebe resposta
          // e fica pendurado.
          timerEspera = setTimeout(function () {
            timerEspera = 0
            irParaRest()
          }, MS_ESPERA_REALTIME)

          canal
            .on('broadcast', { event: 'pong' }, function (m) {
              aoEvento('pong', (m && m.payload) || {})
            })
            .on('broadcast', { event: 'estado' }, function (m) {
              aoEvento('estado', (m && m.payload) || {})
            })
            .subscribe(function (status) {
              if (status === 'SUBSCRIBED') {
                if (timerEspera) { clearTimeout(timerEspera); timerEspera = 0 }
                transporte = 'realtime'
                enviarEvento('ping', { id: meuPing })
                if (aguardandoPong) clearTimeout(aguardandoPong)
                // Silêncio aqui NÃO é mais "não existe submarino": pode
                // ser um Chromebook que só alcança o REST. Por isso o
                // estouro do pong tenta o outro caminho antes de
                // desistir, em vez de mandar o operador conferir um
                // código que está certo.
                aguardandoPong = setTimeout(function () {
                  irParaRest('ainda procurando — tentando pelo caminho lento...')
                }, MS_PONG)
                return
              }
              if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                irParaRest()
              }
            })
        } catch (e) {
          irParaRest()
        }
      }

      // O topo mostra o transporte porque a diferença é sentida, não
      // vista: no REST a tecla demora uns 600 ms a mais pra fazer efeito
      // no projetor. Sem esse aviso o operador aperta de novo achando
      // que falhou — e manda o comando duas vezes.
      function rotuloBadge(turma) {
        var rest = transporte === 'rest'
        $('transporte').hidden = !rest
        // Com o marcador na tela o topo fica apertado num celular de
        // 360 px, e alguma coisa tem que sair. Sai "conectado": a cor do
        // badge ja diz isso, e a turma nao pode sumir — e ela que o
        // operador confere quando pega o celular de outra pessoa.
        return rest ? turma : 'conectado · ' + turma
      }

      function abrirControle(turma) {
        $('recado').textContent = ''
        $('conectar').disabled = false
        $('badge').textContent = rotuloBadge(turma)
        mostrar('tela-controle')
        if (relogioMudo) clearInterval(relogioMudo)
        relogioMudo = setInterval(vigiar, 1000)
      }

      // O silêncio do `estado` NÃO desliga os botões: pode ser só a publicação
      // que atrasou, e o operador precisa poder apertar → de qualquer jeito.
      function vigiar() {
        var quieto = Date.now() - ultimoRecebido
        var tarja = $('tarja')
        $('badge').classList.toggle('badge--mudo', quieto > MS_MUDO)
        tarja.classList.toggle('tarja--visivel', quieto > MS_MUDO)
        tarja.classList.toggle('tarja--morta', quieto > MS_MORTO)
        if (quieto > MS_MORTO) {
          tarja.textContent = 'sem resposta do submarino — use o teclado'
        } else if (quieto > MS_MUDO) {
          tarja.textContent = 'sem estado há ' + Math.floor(quieto / 1000) + 's'
        }
      }

      function aplicarEstado(e) {
        if (!e) return
        ultimoEstado = e
        var modo = e.modo || 'apresentacao'
        $('tela-controle').setAttribute('data-modo', modo)
        $('badge').textContent = rotuloBadge(e.turma)
        $('badge').classList.remove('badge--mudo')
        $('tarja').classList.remove('tarja--visivel', 'tarja--morta')
        $('cena-titulo').textContent = e.cenaTitulo || ''
        $('instrucao').textContent = e.instrucao || ''
        $('cena-proxima').textContent = e.proximaTitulo ? 'próxima: ' + e.proximaTitulo : ''

        var teclas = e.teclasDisponiveis || []
        var temVF = teclas.indexOf('v') >= 0
        var numeros = modo === 'quiz' || modo === 'identificacao' || modo === 'hidrofone'
        // Sem nenhuma tecla de modo, a área fica com uma frase e nada mais:
        // uma grade de botões apagados só faria o operador procurar o que
        // apertar numa cena em que não há nada pra apertar.
        var semTeclas = modo === 'ativacao' || modo === 'mergulho'
        $('modo-cabecalho').textContent =
          numeros && temVF ? 'verdadeiro ou falso' : NOME_DO_MODO[modo] || modo
        $('bloco-vazio').textContent =
          modo === 'ativacao'
            ? 'este passo é no Chromebook — alguém precisa apertar uma tecla lá'
            : 'nada a fazer — aguarde'
        $('bloco-vazio').classList.toggle('oculto', !semTeclas)
        $('modo-cabecalho').classList.toggle('oculto', semTeclas)
        $('bloco-espera').classList.toggle('oculto', modo !== 'espera')
        // O aviso é do Chromebook, não do celular: o navegador de lá ainda não
        // viu nenhum gesto humano, e uma tecla mandada daqui não serve como
        // gesto. Quem tem que encostar na máquina é quem está perto dela.
        var travado = e.aviso === 'audio-bloqueado' || e.audioDestravado === false
        $('espera-nota').classList.toggle('espera-nota--aviso', travado)
        $('espera-nota').textContent = travado
          ? 'o áudio do Chromebook ainda está travado — toque uma vez na tela dele e volte aqui'
          : 'o → grande aí embaixo é o que inicia a IA'
        $('bloco-apresentacao').classList.toggle('oculto', modo !== 'apresentacao')
        $('bloco-numeros').classList.toggle('oculto', !numeros)
        $('bloco-combate').classList.toggle('oculto', modo !== 'combate')
        $('bloco-emergencia').classList.toggle('oculto', modo !== 'emergencia')
        $('bloco-vf').classList.toggle('oculto', !temVF)

        Array.prototype.forEach.call(document.querySelectorAll('[data-tecla]'), function (b) {
          b.disabled = teclas.indexOf(b.getAttribute('data-tecla')) < 0
        })

        if (e.combate) {
          recargaBase = e.combate.recarga
          tRecarga = Date.now()
          if (!quadroRecarga) quadroRecarga = requestAnimationFrame(animarRecarga)
          $('barra-casco').style.width = Math.round(e.combate.casco * 100) + '%'
          $('barra-contato').style.width = Math.round(e.combate.contato * 100) + '%'
          ;[1, 2, 3].forEach(function (n) {
            $('setor-' + n).classList.toggle('tecla--contato', e.combate.setor === n)
          })
        }
        if (e.emergencia) {
          $('luz-casco').classList.toggle('luz--online', !!e.emergencia.casco)
          $('luz-sonar').classList.toggle('luz--online', !!e.emergencia.sonar)
          $('luz-com').classList.toggle('luz--online', !!e.emergencia.com)
        }
      }

      // A recarga anda sozinha entre um `estado` e outro: a barra do celular
      // conta o tempo local a partir do último valor recebido.
      var recargaBase = 0
      var tRecarga = 0
      var quadroRecarga = 0
      function animarRecarga() {
        var r = Math.max(0, recargaBase - (Date.now() - tRecarga) / MS_COOLDOWN)
        $('barra-recarga').style.width = Math.round((1 - r) * 100) + '%'
        quadroRecarga = r > 0 ? requestAnimationFrame(animarRecarga) : 0
      }

      // ---------- envio ----------
      var ultimoEnvio = {}
      function piscar(botao) {
        botao.classList.add('tecla--flash')
        setTimeout(function () { botao.classList.remove('tecla--flash') }, MS_FLASH)
      }
      function enviarTecla(tecla) {
        var agora = Date.now()
        if (agora - (ultimoEnvio[tecla] || 0) < MS_DEBOUNCE) return
        ultimoEnvio[tecla] = agora
        try { navigator.vibrate && navigator.vibrate(15) } catch (e) {}
        enviarEvento('cmd', { tecla: tecla })
      }

      document.addEventListener('click', function (ev) {
        var alvo = ev.target.closest && ev.target.closest('[data-tecla]')
        if (!alvo || alvo.disabled || alvo.classList.contains('longa')) return
        piscar(alvo)
        // O "/" NÃO vai como tecla: abrir o console no Chromebook desliga o
        // useTeclado de lá, e o celular perderia até o → enquanto estivesse
        // aberto. Aqui ele só abre o campo, que manda `comando`.
        if (alvo.id === 'abrir-console') {
          var caixa = $('console')
          caixa.classList.toggle('oculto')
          if (!caixa.classList.contains('oculto')) $('texto-comando').focus()
          try { navigator.vibrate && navigator.vibrate(15) } catch (e) {}
          return
        }
        enviarTecla(alvo.getAttribute('data-tecla'))
      })

      // Toque longo com barra de progresso, pras duas teclas perigosas.
      Array.prototype.forEach.call(document.querySelectorAll('.longa'), function (b) {
        var inicio = 0
        var quadro = 0
        var barra = b.querySelector('u')
        function parar() {
          cancelAnimationFrame(quadro)
          quadro = 0
          barra.style.width = '0'
        }
        function andar() {
          var f = Math.min(1, (Date.now() - inicio) / MS_LONGO)
          barra.style.width = f * 100 + '%'
          if (f >= 1) {
            parar()
            enviarTecla(b.getAttribute('data-tecla'))
            try { navigator.vibrate && navigator.vibrate([30, 40, 30]) } catch (e) {}
            // Fecha no fim do toque: a gaveta cumpriu o papel dela.
            fecharGaveta()
            return
          }
          quadro = requestAnimationFrame(andar)
        }
        b.addEventListener('pointerdown', function () {
          if (b.disabled) return
          inicio = Date.now()
          quadro = requestAnimationFrame(andar)
        })
        ;['pointerup', 'pointerleave', 'pointercancel'].forEach(function (evento) {
          b.addEventListener(evento, parar)
        })
      })

      $('console').addEventListener('submit', function (ev) {
        ev.preventDefault()
        var texto = $('texto-comando').value.trim()
        if (!texto) return
        enviarEvento('comando', { texto: texto })
        try { navigator.vibrate && navigator.vibrate(15) } catch (e) {}
        $('texto-comando').value = ''
      })
    </script>
  </body>
</html>

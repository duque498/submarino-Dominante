name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: montar site
        run: |
          mkdir -p site/app
          cp -r dist/. site/app/
          cp public/controle.html site/
          [ -f public/audios.js ] && cp public/audios.js site/app/ || true
          [ -d public/audio ] && cp -r public/audio site/app/audio || true
          # A biblioteca vendorizada vai pros DOIS lugares: o app usa
          # app/vendor/ e o controle.html, servido na raiz, usa ./vendor/.
          # (O Vite já copia public/ pro dist, então app/vendor viria de
          # graça — o cp explícito é pra quebra do site ser visível AQUI,
          # e não como 404 silencioso no celular no dia da feira.)
          # `vendor/.` e não `vendor`: o dist já traz app/vendor (o Vite
          # copia public/), e `cp -r vendor` num destino que existe criaria
          # app/vendor/vendor — o 404 silencioso de novo, só que pior.
          mkdir -p site/app/vendor site/vendor
          cp -r public/vendor/. site/app/vendor/
          cp -r public/vendor/. site/vendor/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
